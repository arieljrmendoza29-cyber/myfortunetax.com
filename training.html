<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FTA Level 1 Training Schedule</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#006B48">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,600;0,700;1,500&family=Poppins:wght@400;500;600;700&display=swap">
<style>
:root{
  --cream:#FBF7EF;--paper:#FFFFFF;--ink:#1D1D1B;--muted:#6B675F;--line:#EADFC9;
  --emerald:#006B48;--emerald-deep:#00543A;--mint:#E6F2EC;
  --gold:#C9A24D;--gold-soft:#E8D39A;--gold-text:#8A6A22;--gold-tint:#F7EEDA;
  --serif:Lora,Georgia,serif;--sans:Poppins,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{background:var(--cream)}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--emerald)}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 40px}
.sheet{background:var(--cream);border:1.5px solid var(--gold-soft);border-radius:18px;padding:28px clamp(16px,4vw,40px) 30px;position:relative;box-shadow:0 0 0 6px var(--cream),0 0 0 7px var(--line)}
.logo{display:block;margin:0 auto 22px;width:210px;max-width:62%;height:auto}
/* fade-up animation */
.rise{opacity:0;transform:translateY(14px);animation:rise .7s ease forwards}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rise{animation:none;opacity:1;transform:none}}

.hero{background:linear-gradient(135deg,#00754F 0%,var(--emerald) 45%,var(--emerald-deep) 100%);color:#fff;border-radius:16px;padding:clamp(22px,4vw,34px);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(232,211,154,.22),transparent 70%)}
.kicker{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-soft);font-weight:600;margin-bottom:8px}
.hero h1{font-family:var(--serif);font-size:clamp(28px,5vw,40px);line-height:1.15;font-weight:700;max-width:560px}
.hero h1 em{font-style:normal;color:var(--gold-soft)}
.hero p{margin-top:12px;max-width:600px;font-size:15px;color:#E9F3EE}
.cap{font-size:44px;position:absolute;right:28px;top:50%;transform:translateY(-50%);opacity:.95}
@media (max-width:640px){.cap{display:none}}
.pill{display:inline-block;margin-top:16px;background:var(--gold-soft);color:#3F3110;font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px}

.sec{margin-top:30px}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sec-h h2{font-family:var(--serif);color:var(--emerald);font-size:24px;font-weight:700;white-space:nowrap}
.sec-h .ic{color:var(--gold);font-size:18px}
.sec-h:after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold),rgba(201,162,77,0))}
.sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.note{color:var(--muted);font-size:13px;font-style:italic;margin-top:10px}

.goals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.goal{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px;transition:transform .2s,box-shadow .2s}
.goal:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.06)}
.goal.full{grid-column:1/-1}
@media (max-width:640px){.goals{grid-template-columns:1fr}}

.nights{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.nights{grid-template-columns:1fr}}
.night{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.night h3{font-family:var(--serif);color:var(--emerald);font-size:19px}
.time{display:inline-block;background:var(--emerald);color:#fff;font-weight:600;font-size:13px;border-radius:999px;padding:4px 12px;margin:8px 0}
.night p{font-size:14px;color:var(--muted)}

.zoom{margin-top:14px;display:flex;align-items:center;gap:16px;border:1.5px dashed var(--gold);border-radius:14px;padding:14px 16px;background:var(--paper);flex-wrap:wrap}
.zbtn{background:linear-gradient(180deg,#B8913F,#9E7A2C);color:#fff;text-decoration:none;font-weight:600;padding:10px 20px;border-radius:999px;transition:transform .2s,box-shadow .2s;white-space:nowrap}
.zbtn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(158,122,44,.35)}
.zinfo b{color:var(--emerald);font-size:14px}
.zinfo a{display:block;font-size:12px;word-break:break-all}
.copy{margin-left:auto;border:1px solid var(--line);background:var(--cream);border-radius:999px;padding:7px 14px;font:600 12px var(--sans);color:var(--emerald);cursor:pointer}
.ready{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
@media (max-width:640px){.ready{grid-template-columns:1fr 1fr}}
.ready div{background:var(--emerald);color:#fff;border-radius:12px;text-align:center;padding:14px 8px;font-weight:600;font-size:13px}
.ready span{display:block;font-size:20px;margin-bottom:4px}

.cls{display:flex;flex-direction:column;gap:8px}
.cls-head{display:grid;grid-template-columns:44px 120px 1fr;gap:10px;font-size:11px;letter-spacing:2px;font-weight:600;color:var(--gold-text);padding:0 12px}
.row{display:grid;grid-template-columns:44px 120px 1fr;gap:10px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;transition:transform .2s,box-shadow .2s;position:relative}
.row:hover{transform:translateX(3px);box-shadow:0 6px 16px rgba(0,0,0,.05)}
.num{width:28px;height:28px;border-radius:50%;background:var(--emerald);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center}
.date{color:var(--emerald);font-weight:700;font-size:14px}
.title{font-size:14px}
.tag{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:2px 9px;border-radius:999px;vertical-align:1px}
.t-workshop{background:var(--gold-tint);color:var(--gold-text)}
.t-lesson{background:var(--mint);color:var(--emerald)}
.t-exam{background:var(--mint);color:var(--emerald)}
.t-celebrate{background:var(--gold-tint);color:var(--gold-text)}
.row.gold{background:linear-gradient(90deg,#FFF9EC,#FBEFD3);border-color:var(--gold-soft)}
.row.gold .num{background:#A88A4E}
.row.gold .title{font-weight:700}
.row.break{background:#F1ECE2;border-style:dashed}
.row.break .num{background:#CDBFA6}
.row.break .date,.row.break .title{color:var(--muted);font-style:italic}
.row.done{opacity:.6}
.row.next{border:2px solid var(--emerald);box-shadow:0 6px 18px rgba(0,107,72,.12)}
.badge{display:inline-block;margin-left:8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 9px;border-radius:999px;background:var(--emerald);color:#fff;vertical-align:1px}
@media (max-width:640px){
  .cls-head{display:none}
  .row{grid-template-columns:36px 1fr;row-gap:2px}
  .row .title{grid-column:2}
}
.after{margin-top:12px;background:var(--emerald);color:#fff;border-radius:12px;padding:12px 16px;text-align:center;font-size:14px}
.after b{color:var(--gold-soft)}

.events{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.events{grid-template-columns:1fr}}
.ev{background:var(--paper);border:1.5px solid var(--gold-soft);border-radius:14px;padding:14px 16px}
.ev h3{font-family:var(--serif);color:var(--emerald);font-size:18px}
.when{display:inline-block;background:var(--gold-soft);color:#3F3110;font-weight:600;font-size:12px;border-radius:999px;padding:3px 11px;margin:8px 0}
.ev p{font-size:13px;color:var(--muted)}

.close{text-align:center;margin-top:26px}
.close p{font-family:var(--serif);font-style:italic;color:var(--emerald);font-size:20px}
.close small{display:block;margin-top:4px;letter-spacing:3px;font-size:11px;font-weight:700;color:var(--gold-text)}
.foot{text-align:center;margin-top:22px;font-size:11px;letter-spacing:2.5px;color:var(--gold-text)}
.updated{text-align:center;font-size:11px;color:var(--muted);margin-top:6px}
.dl{display:inline-block;margin-top:14px;background:#fff;color:var(--emerald);font-weight:600;font-size:13px;text-decoration:none;padding:8px 16px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .2s}
.dl:hover{transform:translateY(-1px)}
@page{size:letter;margin:12mm}
@media print{
  html,body{background:#fff}
  .sheet{zoom:.82}
  .sec{margin-top:18px}
  .cls{gap:5px}
  .row{padding:7px 12px}
  .hero{padding:22px 26px}
  .close{margin-top:14px}
  .wrap{max-width:none;padding:0}
  .sheet{box-shadow:none;border:none;padding:0}
  .rise{opacity:1!important;transform:none!important;animation:none!important}
  .dl,.copy,.toast,.updated,.cap{display:none!important}
  .hero,.ready div,.after,.num,.time,.row.next{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .row,.goal,.night,.ev,.zoom{break-inside:avoid}
  .row.done{opacity:1}
  .badge{display:none}
  .row.next{border:1px solid var(--line);box-shadow:none}
  .sec:nth-of-type(4){break-before:page}
}
.sheet.pdfmode{box-shadow:none;border:none;padding:6px 10px;background:#FBF7EF;width:1040px;max-width:none}
.sheet.pdfmode .goals,.sheet.pdfmode .nights,.sheet.pdfmode .events{grid-template-columns:1fr 1fr}
.sheet.pdfmode .ready{grid-template-columns:repeat(4,1fr)}
.sheet.pdfmode .cls-head{display:grid}
.sheet.pdfmode .row{grid-template-columns:44px 120px 1fr;row-gap:0}
.sheet.pdfmode .row .title{grid-column:auto}
.sheet.pdfmode .cap{display:none}
.pdfmode .rise{opacity:1!important;transform:none!important;animation:none!important}
.pdfmode .dl,.pdfmode .copy,.pdfmode .cap,.pdfmode .updated,.pdfmode .badge{display:none!important}
.pdfmode .row.done{opacity:1}
.pdfmode .row.next{border:1px solid var(--line);box-shadow:none}
.pdfmode .row,.pdfmode .goal,.pdfmode .night,.pdfmode .ev,.pdfmode .zoom,.pdfmode .hero{transition:none!important}
.pdfmode .sec{margin-top:18px}
.pdfmode .cls{gap:5px}
.pdfmode .row{padding:7px 12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
/* *text* in the sheet becomes highlighted text */
function rich(s){return esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>")}
function richB(s){return esc(s).replace(/\*([^*]+)\*/g,"<b>$1</b>")}
function safeUrl(u){return /^https:\/\//i.test(u||"")?u:"#"}

var MONTHS={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function parseDate(txt,year){
  var m=String(txt).toLowerCase().match(/(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})/);
  if(!m) return null;
  var y=parseInt(year,10)||new Date().getFullYear();
  if(MONTHS[m[1]]<6 && y) y=y+1; /* Jan–Jun dates belong to the next year */
  return new Date(y,MONTHS[m[1]],parseInt(m[2],10));
}
function todayET(){
  var p=new Intl.DateTimeFormat("en-US",{timeZone:"America/New_York",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date());
  var o={};p.forEach(function(x){o[x.type]=x.value});
  return new Date(+o.year,+o.month-1,+o.day);
}

    return '<div class="'+cls+'"><span class="num">'+esc(num||"–")+'</span><span class="date">'+esc(date)+'</span><span class="title">'+esc(title)+tag+badge+'</span></div>';
  }).join("");
  $("after").innerHTML=richB(I["After note"]||"");
  $("after").style.display=I["After note"]?"":"none";
  $("events").innerHTML=(d.events||[]).filter(function(e){return e[0]}).map(function(e){
    return '<div class="ev"><h3>'+esc(e[0])+'</h3><span class="when">Date &amp; time: '+esc(e[1]||"TBD")+'</span><p>'+esc(e[2]||"")+'</p></div>';
  }).join("");
  $("closing").textContent=I["Closing"]||"";
  var pdf=I["PDF link"]; var dl=$("dl");
  if(/^https:\/\//i.test(pdf||"")){dl.href=pdf;dl.target="_blank";dl.rel="noopener";dl.onclick=null;}
  else{dl.removeAttribute("target");dl.href="#";dl.onclick=function(e){e.preventDefault();downloadPDF();};}

}


/* Download PDF: builds the PDF in the browser from the latest schedule and saves it as a file.
   If that fails (old browser, blocked script), it falls back to Print / Save as PDF. */
var H2P="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
function loadH2P(){return new Promise(function(ok,no){
  if(window.html2pdf) return ok();
  var sc=document.createElement("script");sc.src=H2P;sc.onload=ok;sc.onerror=no;document.head.appendChild(sc);
})}
var busy=false;
/* Each PDF page is captured from a hidden copy of the page, so the visible page never changes. */
function capture(sheet,removeSel){
  var box=document.createElement("div");
  box.style.cssText="position:fixed;left:-12000px;top:0;width:1040px;background:#FBF7EF";
  var root=document.getElementById("fta-training")||sheet;   /* TaxNitro version is wrapped in #fta-training */
  var cl=root.cloneNode(true);
  (cl.classList.contains("sheet")?cl:cl.querySelector(".sheet")).classList.add("pdfmode");
  Array.prototype.forEach.call(cl.querySelectorAll(".toast"),function(e){e.remove()});
  Array.prototype.forEach.call(cl.querySelectorAll(removeSel),function(e){e.remove()});
  box.appendChild(cl);document.body.appendChild(box);
  return window.html2pdf().set({margin:0,jsPDF:{unit:"px",format:[1040,1600],hotfixes:["px_scaling"]},
    html2canvas:{scale:2,useCORS:true,backgroundColor:"#FBF7EF"}}).from(cl).toCanvas().get("canvas")
    .then(function(c){box.remove();return c},function(e){box.remove();throw e});
}
function downloadPDF(){
  if(busy) return; busy=true;
  var dl=$("dl"),label=dl.textContent; dl.textContent="Preparing PDF…";
  function done(){busy=false;dl.textContent=label}
  var sheet=document.querySelector(".sheet"),pages=[];
  loadH2P().then(function(){
    return capture(sheet,"#schedSec,#eventsSec,.close,.foot,.updated");
  }).then(function(c){pages.push(c);
    return capture(sheet,".logo,.hero,#goalsSec,#meetSec,.updated");
  }).then(function(c){pages.push(c);
    return window.html2pdf().set({margin:0,jsPDF:{unit:"mm",format:"letter",orientation:"portrait"}}).from("<div></div>").toPdf().get("pdf");
  }).then(function(pdf){
    var W=215.9,H=279.4,m=9;
    pages.forEach(function(c,i){
      if(i) pdf.addPage();
      var w=W-2*m,h=c.height*w/c.width;
      if(h>H-2*m){h=H-2*m;w=c.width*h/c.height}
      pdf.setFillColor(251,247,239);pdf.rect(0,0,W,H,"F");
      pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",(W-w)/2,m,w,h);
    });
    pdf.save("FTA-Level-1-Training-Schedule.pdf");
  }).then(done).catch(function(){done();window.print()});
}

render(DEFAULT);
fetch(SCRIPT_URL+"?form=training").then(function(r){return r.json()}).then(function(d){
  if(d && d.classes && d.classes.length){render(d);$("updated").textContent="Latest schedule loaded"}
}).catch(function(){});
